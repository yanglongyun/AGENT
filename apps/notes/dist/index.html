<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <style>
:root {
    --bg: #fff; --fg: #16181d; --dim: #6b7280; --line: #e6e8ec;
    --accent: #2f6bde; --danger: #d93a3a; --soft: #f6f7f9;
    color-scheme: light;
}
:root[data-theme="dark"] {
    --bg: #1b1c1f; --fg: #e8eaed; --dim: #9aa0aa; --line: #2f3136;
    --accent: #6f9bf0; --danger: #f07777; --soft: #232427;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 22px 18px 60px; }

.composer { display: flex; gap: 8px; }
.input {
    flex: 1; min-width: 0; height: 38px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--fg); font-size: 14px;
}
.input:focus { outline: none; border-color: var(--accent); }

.btn {
    height: 38px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--bg); color: var(--fg);
    font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.tools { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; }
.count { font-size: 12px; color: var(--dim); }

.summary, .notice {
    margin-top: 14px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--soft); font-size: 13px; white-space: pre-wrap;
}
.notice { border-color: var(--danger); color: var(--danger); background: transparent; }

.list { list-style: none; margin: 18px 0 0; padding: 0; }
.item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 2px; border-bottom: 1px solid var(--line);
}
.item-text { flex: 1; min-width: 0; word-break: break-word; }
.item-at { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
.del {
    border: 0; background: none; color: var(--dim);
    cursor: pointer; font-size: 12px; padding: 2px 4px;
}
.del:hover { color: var(--danger); }
.empty { color: var(--dim); text-align: center; padding: 34px 0; font-size: 13px; }

</style>
</head>
<body>
    <main class="wrap">
        <form class="composer" id="composer">
            <input id="text" class="input" placeholder="记一条…" autocomplete="off" maxlength="4000" />
            <button class="btn primary" type="submit">记下</button>
        </form>

        <div class="tools">
            <button class="btn" id="summarize" type="button">让 AI 归纳</button>
            <span class="count" id="count"></span>
        </div>

        <div class="summary" id="summary" hidden></div>
        <div class="notice" id="notice" hidden></div>
        <ul class="list" id="list"></ul>
    </main>
    <script type="module">
// 便签前端。两条通道,前缀一分:
//   api/*   → 自己的后端(宿主反代过去)
//   host/*  → 宿主能力(要 token)
// token 既不写死也不放 URL:页面向父窗口报到,宿主校验来源后回给我们。

const state = { token: '', notes: [], summarizing: false };
const $ = (id) => document.getElementById(id);

window.parent.postMessage({ type: 'os.ready' }, '*');
window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    if (event.data?.type !== 'os.init') return;
    state.token = String(event.data.token || '');
    document.documentElement.dataset.theme = event.data.theme === 'dark' ? 'dark' : 'light';
});

async function call(path, { method = 'GET', body, auth = false } = {}) {
    const headers = { 'content-type': 'application/json' };
    if (auth) headers.authorization = `Bearer ${state.token}`;
    const response = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
}

function notice(message) {
    const box = $('notice');
    box.textContent = message || '';
    box.hidden = !message;
}

const when = (iso) => {
    const at = new Date(iso);
    return Number.isNaN(at.getTime()) ? '' : at.toLocaleString('zh-CN', { hour12: false }).replace(/:\d\d$/, '');
};

function render() {
    const list = $('list');
    list.replaceChildren();
    $('count').textContent = state.notes.length ? `${state.notes.length} 条` : '';

    if (!state.notes.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '还没有笔记,上面记一条试试';
        list.append(empty);
        return;
    }

    for (const note of state.notes) {
        const item = document.createElement('li');
        item.className = 'item';

        const main = document.createElement('div');
        main.className = 'item-text';
        // textContent 而不是 innerHTML —— 笔记是用户输入,不当 HTML 解释
        const text = document.createElement('div');
        text.textContent = note.text;
        const at = document.createElement('div');
        at.className = 'item-at';
        at.textContent = when(note.created_at);
        main.append(text, at);

        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '删除';
        del.onclick = async () => {
            try { await call(`api/notes/${note.id}`, { method: 'DELETE' }); await load(); }
            catch (error) { notice(String(error.message)); }
        };

        item.append(main, del);
        list.append(item);
    }
}

async function load() {
    try {
        notice('');
        state.notes = (await call('api/notes')).notes || [];
        render();
    } catch (error) {
        notice(`读取失败:${error.message}`);
    }
}

$('composer').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = $('text');
    const text = input.value.trim();
    if (!text) return;
    try {
        await call('api/notes', { method: 'POST', body: { text } });
        input.value = '';
        await load();
    } catch (error) { notice(`保存失败:${error.message}`); }
});

$('summarize').addEventListener('click', async () => {
    if (state.summarizing) return;
    if (!state.notes.length) { notice('还没有笔记可归纳'); return; }
    if (!state.token) { notice('还没拿到宿主凭证,刷新一下这个应用再试'); return; }

    const button = $('summarize');
    state.summarizing = true;
    button.disabled = true;
    button.textContent = '归纳中…';
    notice('');
    try {
        const data = await call('host/ai/complete', {
            method: 'POST',
            auth: true,
            body: {
                instructions: '你在帮用户归纳便签。用不超过 5 条要点概括,中文,直接输出要点本身,不要开场白。',
                prompt: state.notes.map((note, index) => `${index + 1}. ${note.text}`).join('\n'),
            },
        });
        const box = $('summary');
        box.textContent = data.text || '(模型没有返回内容)';
        box.hidden = false;
    } catch (error) {
        notice(`归纳失败:${error.message}`);
    } finally {
        state.summarizing = false;
        button.disabled = false;
        button.textContent = '让 AI 归纳';
    }
});

void load();

</script>
</body>
</html>
